name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install dependencies
      run: npm install

    - name: 🏗️ Build project
      run: npm run build

    - name: 🚀 Deploy via SFTP
      uses: nuno-fernandes/sftp-deploy-action@v1.2.0
      with:
        server: ${{ secrets.SFTP_SERVER }}
        username: ${{ secrets.SFTP_USERNAME }}
        password: ${{ secrets.SFTP_PASSWORD }}
        port: 22
        local_path: dist
        remote_path: /home/smarter-choices-wellness/htdocs/wellness.smarter-choices.com/max-testing
        delete_remote_files: true
